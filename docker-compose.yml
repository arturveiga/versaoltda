services:
  wordpress:
    image: wordpress:php8.2-apache
    container_name: versaoltda_wordpress
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: versaoltda
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
    volumes:
      - ./:/var/www/html

  db:
    image: mysql:8.0
    container_name: versaoltda_db
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: versaoltda
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./database/versao-ltda-dev.sql:/docker-entrypoint-initdb.d/versao-ltda-dev.sql:ro

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: versaoltda_phpmyadmin
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root

volumes:
  db_data:
