services:
  wordpress:
    image: wordpress:php8.2-apache
    container_name: versaoltda_wordpress
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: versaoltda
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DEBUG: "false"
      WORDPRESS_FS_METHOD: direct
    volumes:
      - ./:/var/www/html
      - ./docker/php.ini:/usr/local/etc/php/conf.d/zz-versao-ltda.ini:ro

  db:
    image: mysql:8.0
    container_name: versaoltda_db
    command:
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=512M
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=64M
      - --table-open-cache=2000
      - --tmp-table-size=64M
      - --max-heap-table-size=64M
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: versaoltda
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
      - ./database/versao-ltda-dev.sql:/docker-entrypoint-initdb.d/versao-ltda-dev.sql:ro

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: versaoltda_phpmyadmin
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root

volumes:
  db_data:
